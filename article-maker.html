<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahil.top | Article File Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #050505; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .form-input { width: 100%; padding: 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.75rem; color: white; outline: none; transition: 0.3s; }
        .form-input:focus { border-color: #2563eb; background: rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-4xl font-bold mb-4">Article <span class="text-blue-600">File Maker</span></h1>
            <p class="text-slate-400">Fill the details and click generate to download your HTML file.</p>
        </header>

        <div class="glass-card p-8 shadow-2xl">
            <form id="articleForm" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">Article Title</label>
                        <input type="text" id="title" placeholder="e.g. Future of Web Design" class="form-input" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">File Name (e.g. my-article)</label>
                        <input type="text" id="slug" placeholder="e.g. future-web-design" class="form-input" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2">Meta Description</label>
                    <textarea id="description" rows="2" placeholder="Short summary for SEO..." class="form-input" required></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">Main Image URL</label>
                        <input type="text" id="mainImage" placeholder="https://..." class="form-input" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-400 mb-2">Read Time</label>
                        <input type="text" id="readTime" placeholder="5 Min Read" class="form-input" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-400 mb-2">Article Body (HTML)</label>
                    <textarea id="content" rows="10" placeholder="<p>Your content...</p>" class="form-input" required></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="gridImg1" placeholder="Grid Image 1 URL" class="form-input">
                    <input type="text" id="gridImg2" placeholder="Grid Image 2 URL" class="form-input">
                </div>

                <button type="button" onclick="generateAndDownload()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all">
                    <i class="fas fa-download mr-2"></i> Generate & Download HTML File
                </button>
            </form>
        </div>
    </div>

    <script>
        function generateAndDownload() {
            try {
                const title = document.getElementById('title').value;
                const slug = document.getElementById('slug').value;
                const desc = document.getElementById('description').value;
                const mainImg = document.getElementById('mainImage').value;
                const readTime = document.getElementById('readTime').value;
                const content = document.getElementById('content').value;
                const gridImg1 = document.getElementById('gridImg1').value;
                const gridImg2 = document.getElementById('gridImg2').value;

                if (!title || !slug || !content) {
                    alert('Please fill all required fields!');
                    return;
                }

                const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                const isoDate = new Date().toISOString();

                // Escape function to prevent attribute breakage
                const esc = (str) => str.replace(/"/g, '&quot;');

                const htmlContent = `<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} | Sahil Jangra</title>
    <meta name="description" content="${esc(desc)}">
    <meta name="author" content="Sahil Jangra">
    <meta name="theme-color" content="#050505">
    <link rel="canonical" href="https://technologia-ashen.vercel.app/articles/${slug}.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://technologia-ashen.vercel.app/articles/${slug}.html">
    <meta property="og:title" content="${esc(title)}">
    <meta property="og:description" content="${esc(desc)}">
    <meta property="og:image" content="${mainImg}">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://technologia-ashen.vercel.app/articles/${slug}.html">
    <meta property="twitter:title" content="${esc(title)}">
    <meta property="twitter:description" content="${esc(desc)}">
    <meta property="twitter:image" content="${mainImg}">

    <meta property="article:published_time" content="${isoDate}">
    <link rel="icon" type="image/png" href="../assets/icons/pre-load.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"><\/script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#4f46e5', dark: '#050505', surface: '#0a0a0a', accent: '#0ea5e9' },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], display: ['"Space Grotesk"', 'sans-serif'] }
                }
            }
        }
    <\/script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark text-slate-200 overflow-x-hidden">
    <!-- Background Decor -->
    <div class="fixed inset-0 z-0 bg-grid-pattern pointer-events-none opacity-20"></div>
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-primary/20 rounded-full blur-[120px] pointer-events-none opacity-30 z-0"></div>

    <article class="relative z-10 pt-32 pb-24">
        <div class="container mx-auto px-6 max-w-4xl">
            <!-- Back Button -->
            <a href="../articles.html" class="inline-flex items-center gap-2 text-slate-400 hover:text-white mb-8 group transition-colors">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Back to Articles
            </a>

            <!-- Article Header -->
            <header class="mb-12">
                <div class="flex items-center gap-4 mb-6 text-xs font-bold uppercase tracking-[0.2em] text-primary">
                    <span class="px-3 py-1 bg-primary/10 rounded-full">${date}</span>
                    <span class="w-1 h-1 bg-slate-600 rounded-full"></span>
                    <span>${readTime}</span>
                </div>
                <h1 class="font-display text-4xl md:text-6xl font-bold mb-8 leading-[1.1] text-white">${title}</h1>
                
                <div class="aspect-video rounded-[2rem] overflow-hidden mb-12 border border-white/10 shadow-2xl relative group">
                    <img src="${mainImg}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt="${esc(title)}">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark/50 to-transparent"></div>
                </div>
            </header>

            <!-- Article Content -->
            <div class="prose prose-invert prose-lg max-w-none prose-headings:font-display prose-headings:text-white prose-p:text-slate-400 prose-strong:text-white prose-a:text-primary hover:prose-a:text-blue-400 transition-colors">
                ${content}
                
                ${(gridImg1 || gridImg2) ? `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-16">
                    ${gridImg1 ? `
                    <div class="aspect-[4/5] rounded-3xl overflow-hidden border border-white/10 shadow-xl group">
                        <img src="${gridImg1}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy">
                    </div>` : ''}
                    ${gridImg2 ? `
                    <div class="aspect-[4/5] rounded-3xl overflow-hidden border border-white/10 shadow-xl group">
                        <img src="${gridImg2}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy">
                    </div>` : ''}
                </div>` : ''}
            </div>

            <!-- Author Card -->
            <footer class="mt-24 pt-12 border-t border-white/10">
                <div class="glass-card p-8 flex flex-col md:flex-row items-center gap-8 text-center md:text-left">
                    <div class="w-24 h-24 rounded-2xl overflow-hidden border-2 border-primary/20 rotate-3 group-hover:rotate-0 transition-transform shadow-xl">
                        <img src="../assets/images/photo1.jpg" class="w-full h-full object-cover" alt="Sahil Jangra">
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-bold text-primary uppercase tracking-widest mb-2">Written By</div>
                        <h4 class="text-2xl font-bold text-white mb-2">Sahil Jangra</h4>
                        <p class="text-slate-400 mb-4">A passionate Web Developer & UI/UX Designer dedicated to building high-performance, premium digital experiences for global clients.</p>
                        <div class="flex justify-center md:justify-start gap-4">
                            <a href="https://github.com/KRYZO-MINE" class="text-slate-400 hover:text-primary transition-colors"><i class="fab fa-github text-xl"></i></a>
                            <a href="https://linkedin.com" class="text-slate-400 hover:text-primary transition-colors"><i class="fab fa-linkedin text-xl"></i></a>
                            <a href="https://twitter.com" class="text-slate-400 hover:text-primary transition-colors"><i class="fab fa-twitter text-xl"></i></a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </article>

    <!-- Simple Footer -->
    <footer class="py-12 border-t border-white/10 bg-black/50 relative z-10">
        <div class="container mx-auto px-6 text-center">
            <p class="text-slate-500 text-sm mb-4">© 2026 Sahil Jangra. All rights reserved.</p>
            <div class="flex justify-center gap-6 text-xs text-slate-600 uppercase tracking-widest">
                <a href="../legal.html#privacy" class="hover:text-white transition-colors">Privacy Policy</a>
                <a href="../legal.html#terms" class="hover:text-white transition-colors">Terms of Service</a>
            </div>
        </div>
    </footer>

    <!-- Floating Navigation -->
    <header class="fixed bottom-8 left-0 right-0 z-50 flex justify-center px-4">
        <nav class="bg-surface/80 backdrop-blur-2xl border border-white/10 rounded-full px-6 py-3 flex items-center justify-between gap-8 shadow-2xl w-full max-w-4xl">
            <a href="../index.html" class="text-xl font-bold font-display tracking-tight text-white">SAHIL<span class="text-primary">.TOP</span></a>
            <ul class="hidden md:flex items-center gap-8 text-[11px] font-black uppercase tracking-[0.2em]">
                <li><a href="../index.html#home" class="text-slate-400 hover:text-white transition-colors">Home</a></li>
                <li><a href="../articles.html" class="text-white">Articles</a></li>
                <li><a href="../index.html#projects" class="text-slate-400 hover:text-white transition-colors">Projects</a></li>
            </ul>
            <a href="../index.html#contact" class="px-6 py-2.5 bg-primary text-white rounded-full text-[11px] font-black uppercase tracking-widest hover:bg-blue-600 transition-all shadow-lg shadow-primary/20">Hire Me</a>
        </nav>
    </header>

    <script src="../js/main.js"><\/script>
</body>
</html>`;

                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${slug || 'article'}.html`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                console.log('File generated and download started.');
            } catch (error) {
                console.error('Error generating file:', error);
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
